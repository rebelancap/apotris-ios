name: Apotris
options:
  bundleIdPrefix: com.rebelancap
  deploymentTarget:
    iOS: "17.0"
    visionOS: "2.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 57G8J46Z2T
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    GCC_PREPROCESSOR_DEFINITIONS:
      - IOS=1
      - TE=1
      - NO_ONLINE=1
      - APOTRIS_LOG_TO_DOCS=1
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../work/apotris/include
      - $(SRCROOT)/../work/apotris/data
      - $(SRCROOT)/../work/apotris/subprojects/Tilengine/include
      - $(SRCROOT)/../work/apotris/subprojects/SoLoud/include
      - $(SRCROOT)/../work/apotris/build-core-$(PLATFORM_NAME)
    LIBRARY_SEARCH_PATHS:
      - $(SRCROOT)/../work/apotris/build-core-$(PLATFORM_NAME)
    OTHER_LDFLAGS:
      - -lapotris
      - -lz
    SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Shell/AppBridge.h
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UIStatusBarHidden: true
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  Apotris:
    type: application
    platform: iOS
    sources:
      - path: Shell
      - path: Swift
      - path: Assets.xcassets
      - path: ../work/apotris/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebelancap.apotris
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Apotris
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        GCSupportsControllerUserInteraction: true
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework

  ApotrisVision:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: Shell
      - path: Swift
      - path: Assets-vision.xcassets
      - path: ../work/apotris/assets
        type: folder
        buildPhase: resources
    info:
      path: Info-vision.plist
      properties:
        CFBundleDisplayName: Apotris
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIApplicationSupportsIndirectInputEvents: true
        GCSupportsControllerUserInteraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebelancap.apotris
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "7"
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework

  ApotrisUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
      - path: Swift/FlickClassifier.swift
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ""
        GCC_PREPROCESSOR_DEFINITIONS: []
        LIBRARY_SEARCH_PATHS: []
        OTHER_LDFLAGS: []
        GENERATE_INFOPLIST_FILE: YES

  ApotrisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Apotris
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ""
        GCC_PREPROCESSOR_DEFINITIONS: []
        LIBRARY_SEARCH_PATHS: []
        OTHER_LDFLAGS: []
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Apotris:
    build:
      targets:
        Apotris: all
        ApotrisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ApotrisUnitTests
        - ApotrisUITests
    archive:
      config: Release
  # Distinct scheme required for `xcodebuild -scheme ApotrisVision archive`
  # — xcodegen only emits schemes it's told to declare.
  ApotrisVision:
    build:
      targets:
        ApotrisVision: all
    run:
      config: Debug
    archive:
      config: Release
