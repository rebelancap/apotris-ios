[binaries]
c = ['clang', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/XRSimulator.platform/Developer/SDKs/XRSimulator.sdk', '-target', 'arm64-apple-xros2.0-simulator']
cpp = ['clang++', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/XRSimulator.platform/Developer/SDKs/XRSimulator.sdk', '-target', 'arm64-apple-xros2.0-simulator']
objc = ['clang', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/XRSimulator.platform/Developer/SDKs/XRSimulator.sdk', '-target', 'arm64-apple-xros2.0-simulator']
objcpp = ['clang++', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/XRSimulator.platform/Developer/SDKs/XRSimulator.sdk', '-target', 'arm64-apple-xros2.0-simulator']
ar = 'ar'
ranlib = 'ranlib'
strip = 'strip'
pkg-config = '/usr/bin/false'
cmake = '/opt/homebrew/bin/cmake'

[host_machine]
system = 'darwin'
subsystem = 'visionos-simulator'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[built-in options]
default_library = 'static'
