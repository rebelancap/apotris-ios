[binaries]
c = ['clang', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/XROS.platform/Developer/SDKs/XROS.sdk', '-target', 'arm64-apple-xros2.0']
cpp = ['clang++', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/XROS.platform/Developer/SDKs/XROS.sdk', '-target', 'arm64-apple-xros2.0']
objc = ['clang', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/XROS.platform/Developer/SDKs/XROS.sdk', '-target', 'arm64-apple-xros2.0']
objcpp = ['clang++', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/XROS.platform/Developer/SDKs/XROS.sdk', '-target', 'arm64-apple-xros2.0']
ar = 'ar'
ranlib = 'ranlib'
strip = 'strip'
pkg-config = '/usr/bin/false'

[host_machine]
system = 'darwin'
subsystem = 'visionos'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[built-in options]
default_library = 'static'
